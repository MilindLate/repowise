# KG validation matrix — every repo pinned to a commit so baselines and
# regressions are reproducible. Clones live under /tmp/kg-validate (override
# with KG_VALIDATE_DIR). `source` is a git URL or a local path to clone from.
#
# tier: import-support tier of the dominant language (1 = full resolver +
# validated, 2 = resolver never live-validated, 3 = passthrough).
#
# split: "dev" repos may be read, tuned against and baselined
# (precision_baselines/<repo>.json). "heldout" repos are only ever scored in
# aggregate (run.py --precision --split heldout) and never inspected
# repo by repo; their labels live outside this repo. Never move a repo from
# heldout to dev, and never add one to heldout that a task has looked at.
# ci: "fast" = the per-PR precision job (mechanical oracles, small repos);
# "nightly" = everything else.

[chi]
source = "https://github.com/go-chi/chi"
sha = "3b171578ca44dfd75ca3c5cbddc7b44c600a7b49"
language = "go"
tier = 1
split = "dev"
ci = "nightly"

